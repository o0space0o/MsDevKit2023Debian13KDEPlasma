---
# No Windows partition is mounted. EFI runtime variables are managed only by
# the final host-side verifier, never exposed as a writable chroot mount.
extraMounts:
  - { device: proc, fs: proc, mountPoint: /proc }
  - { device: sys, fs: sysfs, mountPoint: /sys }
  - { device: /dev, mountPoint: /dev, options: [ bind ] }
  - { device: tmpfs, fs: tmpfs, mountPoint: /run }
  - { device: /run/udev, mountPoint: /run/udev, options: [ bind ] }
  - { device: /dev/pts, mountPoint: /dev/pts, options: [ bind ] }
