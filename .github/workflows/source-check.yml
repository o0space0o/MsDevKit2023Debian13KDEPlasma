name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -B scripts/check-source.py --shell
      - run: python3 -B -m unittest discover -s tests
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows, tests -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | Write-Error; $failed = $true }
          }
          if ($failed) { exit 1 }
      - shell: powershell
        run: .\tests\windows-launcher-tests.ps1
